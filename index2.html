"RE-NO":"Register Number","RG - NO":"Register Number","MOBILE NUMBER":"Mobile Number",
"Student Name":"Student Name","Language":"Language","Language One":"Language",
"TOTAL MARKS":"Total Marks","TOTAL":"Total Marks","RANK":"Rank","PERCENTAGE":"Percentage",
"Sr. No.":"Serial Number"
};
function cleanKey(k){return String(k).replace(/\s+/g," ").trim();}
function showResult(){
 const mobile=document.getElementById("mobile").value.replace(/\D/g,"");
 const err=document.getElementById("error"), box=document.getElementById("result");
 err.textContent=""; box.style.display="none"; box.innerHTML="";
 if(!/^\d{10}$/.test(mobile)){err.textContent="Please enter a valid 10-digit mobile number.";return;}
 const matches=students.filter(s=>s.mobile===mobile);
 if(!matches.length){err.textContent="No result found. Please check your mobile number or contact the college office.";return;}
 matches.forEach((s,index)=>{
  const name=s["Student Name"]||"Student";
  const reg=s["RE-NO"]||s["RG - NO"]||"—";
  const total=s["TOTAL MARKS"]??s["TOTAL"]??"—";
  const rank=s["RANK"]??s["RANK "]??"—";
  const pct=Number(s["PERCENTAGE"]);
  const percent=Number.isFinite(pct)?pct.toFixed(2)+"%":"—";
  const skip=new Set(["Sr. No.","RE-NO","RG - NO","MOBILE NUMBER","Student Name","TOTAL MARKS","TOTAL","RANK","RANK ","PERCENTAGE"]);
  let rows="";
  Object.entries(s).forEach(([key,val])=>{
   const k=cleanKey(key);
   if(["course","mobile"].includes(key)||skip.has(k)||val===null||val==="")return;
   rows+=`<tr><td>${escapeHtml(k)}</td><td><strong>${escapeHtml(String(val))}</strong></td></tr>`;
  });
  const card=document.createElement("div");
  card.innerHTML=`<div class="studenthead"><h2>RESULT SCORE CARD</h2><span class="pill">${escapeHtml(s.course)}</span></div>
  <div class="meta"><div><small>Student Name</small><strong>${escapeHtml(name)}</strong></div><div><small>Register Number</small><strong>${escapeHtml(String(reg))}</strong></div><div><small>Course</small><strong>${escapeHtml(s.course)}</strong></div></div>
  <h3>Subject-wise Marks</h3><table><thead><tr><th>Subject</th><th>Marks</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="summary"><div class="stat"><small>Total Marks</small><strong>${escapeHtml(String(total))}</strong></div><div class="stat"><small>Rank</small><strong>${escapeHtml(String(rank))}</strong></div><div class="stat"><small>Percentage</small><strong>${escapeHtml(percent)}</strong></div></div>`;
  if(index>0)card.style.marginTop="28px";
  box.appendChild(card);
 });
 const actions=document.createElement("div");actions.className="actions";
 actions.innerHTML='<button class="secondary" onclick="window.print()">Print Score Card</button><button class="secondary" onclick="resetSearch()">Search Another Number</button>';
 box.appendChild(actions);box.style.display="block";box.scrollIntoView({behavior:"smooth",block:"start"});
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function resetSearch(){document.getElementById("mobile").value="";document.getElementById("result").style.display="none";document.getElementById("result").innerHTML="";document.getElementById("error").textContent="";document.getElementById("lookup").scrollIntoView({behavior:"smooth"});}
document.getElementById("searchBtn").addEventListener("click",showResult);
document.getElementById("mobile").addEventListener("keydown",e=>{if(e.key==="Enter")showResult();});
</script>
</body></html>
